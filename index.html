<section class="contact" id="contact">

```
<div class="container">

    <div class="contact-grid">

        <div>

            <div class="section-title">

                <div class="eyebrow" data-t="contactEyebrow"></div>

                <h2>
                    <span data-t="contactTitle1"></span>
                    <br>
                    <span data-t="contactTitle2"></span>
                </h2>

            </div>

            <p class="contact-text" data-t="contactText"></p>

            <div class="contact-links">

                <a href="mailto:nelli@example.com">
                    nelli@example.com
                </a>

                <a href="tel:+420000000000">
                    +420 000 000 000
                </a>

                <a href="#">
                    Instagram · @nelli.photography
                </a>

            </div>

        </div>


        <div>

            <form class="booking" id="bookingForm">

                <div class="form-grid">

                    <div class="field">

                        <label for="name" data-t="nameLabel"></label>

                        <input
                            id="name"
                            type="text"
                            required
                            autocomplete="name"
                            data-placeholder="name"
                        >

                    </div>


                    <div class="field">

                        <label for="phone" data-t="phoneLabel"></label>

                        <input
                            id="phone"
                            type="tel"
                            required
                            autocomplete="tel"
                            data-placeholder="phone"
                        >

                    </div>


                    <div class="field full">

                        <label for="email" data-t="emailLabel"></label>

                        <input
                            id="email"
                            type="email"
                            autocomplete="email"
                            data-placeholder="email"
                        >

                    </div>


                    <div class="field full">

                        <label for="message" data-t="messageLabel"></label>

                        <textarea
                            id="message"
                            data-placeholder="message"
                        ></textarea>

                    </div>

                </div>


                <div class="form-bottom">

                    <div id="formMessage" aria-live="polite"></div>

                    <button
                        class="submit"
                        id="submitButton"
                        type="submit"
                        data-t="submit"
                    ></button>

                </div>

            </form>

        </div>

    </div>

</div>
```

</section>
